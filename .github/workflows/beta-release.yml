name: Beta release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for this beta (created if missing)
        required: true
        default: v1.0.0-beta.2
  push:
    tags:
      - "v*-beta*"
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --non-interactive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble release APK
        working-directory: android
        env:
          ORG_GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          DEST="$GITHUB_WORKSPACE/Message-in-a-Bottle-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: message-in-a-bottle-android-beta
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Message in a Bottle ${{ steps.apk.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            **Beta** for sideloading on Android (BLE GATT, no server).

            - Install the APK on a **physical phone** (emulators cannot do dual-role GATT).
            - Enable unknown sources if Android asks.
            - Install the same build on two phones, turn Bluetooth on, and open the radio in Settings.

            iOS is not attached here: a signed IPA needs an Apple Developer account and certificates (EAS or Xcode on a Mac).
